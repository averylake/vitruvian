<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background — Signal Black with rounded corners -->
  <rect width="200" height="200" rx="24" fill="#050a14"/>
  <!-- Circle — same as brand logomark -->
  <circle cx="100" cy="100" r="88" stroke="rgba(255,255,255,0.25)" stroke-width="1.2" fill="none"/>
  <!-- Square inscribed — same as brand logomark -->
  <rect x="37.5" y="37.5" width="125" height="125" stroke="rgba(255,255,255,0.5)" stroke-width="1.2" fill="none"/>
  <!-- Signal glow -->
  <circle cx="100" cy="100" r="28" fill="url(#glow)"/>
  <!-- Signal dot — slightly larger for favicon legibility -->
  <circle cx="100" cy="100" r="6" fill="#00d4ff"/>
  <!-- Subtle glow rings — matching brand logomark -->
  <circle cx="100" cy="100" r="12" fill="none" stroke="rgba(0,212,255,0.12)" stroke-width="1"/>
  <circle cx="100" cy="100" r="22" fill="none" stroke="rgba(0,212,255,0.06)" stroke-width="0.5"/>
</svg>
